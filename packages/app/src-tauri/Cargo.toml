[package]
name = "piui"
version = "0.1.0"
description = "PiUI desktop client"
authors = ["PiUI contributors"]
license = "GPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.85.0"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "piui_lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
futures-util = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time", "net", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tauri-plugin-decorum = "1.1.1"
tauri-plugin-single-instance = "2"

# Cargo 依赖选择只认内置 target cfg（desktop/mobile 是 tauri-build 的 build-script
# cfg，在依赖选择阶段不存在），桌面专用依赖必须用显式平台三元组。
# iOS/Android 不编译 service（无桌面 runtime），只走 WS 桥。
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-log = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
opt-level = "s"
