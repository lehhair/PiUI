name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: bun-windows-x64 }
          - { name: linux-x64, os: ubuntu-latest, target: bun-linux-x64 }
          - { name: macos-arm64, os: macos-latest, target: bun-darwin-arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      # 全量验证：typecheck + lint + 三个包的测试 + 构建
      - run: npm run validate

      - name: package desktop bundle
        run: node scripts/package-desktop.mjs --skip-build --target ${{ matrix.target }}

      - name: archive bundle
        shell: bash
        run: |
          cd dist-desktop
          if [ "${{ matrix.name }}" = "windows-x64" ]; then
            7z a -tzip "../piui-${{ matrix.name }}.zip" .
          else
            tar -czf "../piui-${{ matrix.name }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: piui-${{ matrix.name }}
          path: |
            piui-${{ matrix.name }}.zip
            piui-${{ matrix.name }}.tar.gz
          if-no-files-found: ignore

  release:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: piui-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            piui-*.zip
            piui-*.tar.gz
          generate_release_notes: true
