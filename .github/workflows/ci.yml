name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu, os: ubuntu-latest }
          - { name: windows, os: windows-latest }

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # win32 专属补丁在非 Windows 上会让 patch-package 直接报错（包不存在）
      - name: drop windows-only patch
        if: runner.os != 'Windows'
        run: rm -f patches/@lydell+node-pty-win32-x64+*.patch

      - run: npm ci

      # 全量验证：typecheck + lint + 测试（默认 mock 驱动，不调用真实模型）+ 构建
      - run: npm run validate

  tauri-check:
    name: tauri check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/app/src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Drop Windows-only patch
        run: rm -f patches/@lydell+node-pty-win32-x64+*.patch

      - run: npm ci

      # tauri-build 校验 bundle.resources 引用的目录存在；tauri-check 只
      # 编译不打包，不需要真实资源内容，建空目录即可通过存在性检查。
      - name: Prepare empty tauri resources dir
        run: mkdir -p packages/app/src-tauri/resources

      # Tauri 壳编译校验（cargo check + Rust 单元测试），不打包
      - name: Cargo check
        working-directory: packages/app/src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: packages/app/src-tauri
        run: cargo test --lib
